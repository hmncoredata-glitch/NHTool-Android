name: Build NH Tool Stable APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore web app assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets/www/static
          base64 -d payload/index.html.gz.b64 | gunzip > app/src/main/assets/www/index.html
          base64 -d payload/app.js.gz.b64 | gunzip > app/src/main/assets/www/static/app.js
          base64 -d payload/style.css.gz.b64 | gunzip > app/src/main/assets/www/static/style.css
          base64 -d payload/v2_patch.js.gz.b64 | gunzip >> app/src/main/assets/www/static/app.js
          cat payload/v2_2_patch.gz.part* | gunzip >> app/src/main/assets/www/static/app.js
          cat payload/v2_3_fix.js >> app/src/main/assets/www/static/app.js
          cat payload/v2_4_fix.js >> app/src/main/assets/www/static/app.js
          cat payload/v2_6_fix.js >> app/src/main/assets/www/static/app.js
          cat payload/v2_7_fix.js >> app/src/main/assets/www/static/app.js

          cat >> app/src/main/assets/www/static/style.css <<'CSS'

          /* Stable v2 mobile navigation and report grid */
          @media(max-width:900px){
            .bottom-nav{background:#fff;border-top:1px solid #d7e0ea;box-shadow:0 -8px 24px rgba(20,45,80,.10)}
            .bottom-nav .nav-item{color:#53657d!important;background:#fff!important;font-weight:700;opacity:1!important}
            .bottom-nav .nav-item.active{color:#075fbd!important;background:#e6f1ff!important;font-weight:850}
            .bottom-nav .nav-item span{color:inherit!important;opacity:1!important}
          }
          .report-grid-table{width:100%;border-collapse:collapse;table-layout:fixed}
          .report-grid-table th,.report-grid-table td{border:1px solid rgba(105,130,160,.30)!important;text-align:center!important;vertical-align:middle!important;white-space:normal!important;overflow-wrap:anywhere!important;word-break:break-word!important;line-height:1.35}
          .report-grid-table th{background:#dce9f8!important;color:#173b63!important;font-weight:800}
          .report-grid-table tbody tr:nth-child(even){background:#f8fbff}
          .report-grid-table .company-cell{font-weight:850}
          .report-table-scroll,.report-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
          .premium-table{min-width:760px}.data-table.report-grid-table{min-width:880px}
          .history-company{font-size:15px;font-weight:850;color:#132238}.history-address{font-size:13px;color:#42536a;margin-top:5px}
          @media(max-width:900px){.premium-table{min-width:900px}.data-table.report-grid-table{min-width:940px}.report-grid-table th,.report-grid-table td{font-size:10px}}

          html,body{max-width:100%;overflow-x:hidden}
          #page-report,.nh-report-overview,.nh-dashboard-grid,.nh-stat-card{min-width:0;max-width:100%}
          .nh-dashboard-grid{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
          .nh-stat-card{overflow:hidden}
          .nh-stat-card>div:not(.nh-stat-icon){min-width:0;max-width:100%;flex:1 1 auto}
          .nh-stat-card strong{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:clip}
          @media(max-width:620px){
            .nh-report-overview{width:100%;overflow:hidden}
            .nh-dashboard-grid{gap:8px}
            .nh-stat-card{padding:10px;gap:7px;min-height:86px}
            .nh-stat-icon{width:32px!important;height:32px!important;flex:0 0 32px!important;font-size:16px!important}
            .nh-stat-card small{font-size:10.5px!important;line-height:1.2}
            #dashboardGross,#dashboardNet{font-size:clamp(14px,3.8vw,17px)!important;letter-spacing:-.03em}
            #dashboardOrders{font-size:22px!important}
            .nh-deduction-row{gap:2px!important}
            .nh-deduction-row input{width:48px!important;font-size:20px!important}
            .nh-deduction-row b{font-size:18px!important}
            .nh-deduction-content em{font-size:9.5px!important;white-space:nowrap}
          }
          @media(max-width:350px){
            .nh-dashboard-grid{gap:6px}
            .nh-stat-card{padding:8px;gap:5px}
            .nh-stat-icon{width:28px!important;height:28px!important;flex-basis:28px!important;font-size:14px!important}
            #dashboardGross,#dashboardNet{font-size:13px!important}
          }
          CSS

          cat > app/src/main/assets/www/static/logo.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
            <path fill="#0D1C33" d="M54 4 98 29v50L54 104 10 79V29Z"/>
            <path fill="#23E4CF" d="M54 15 87 34v38L54 91 21 72V34Z"/>
            <path fill="#0D1C33" d="M30 36h10l14 22V36h10v36H54L40 50v22H30Zm36 0h10v13h8V36h10v36H84V59h-8v13H66Z"/>
          </svg>
          SVG
          printf '%s' '' | base64 -d > app/src/main/assets/www/static/logo.png

          node --check app/src/main/assets/www/static/app.js
          test -s app/src/main/assets/www/index.html
          test -s app/src/main/assets/www/static/style.css
          test -s app/src/main/assets/www/static/logo.png
          grep -q "nhtool_report_prefs_v202" app/src/main/assets/www/static/app.js
          grep -q "Thực nhận = Tổng tiền - phí khấu trừ" app/src/main/assets/www/static/app.js
          grep -q "NH Tool Stable v2.0.3 hotfix" app/src/main/assets/www/static/app.js
          grep -q "NH Tool Stable v2.0.4" app/src/main/assets/www/static/app.js
          grep -q "NH Tool Stable v2.0.6" app/src/main/assets/www/static/app.js
          grep -q "NH Tool Stable v2.0.7" app/src/main/assets/www/static/app.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned stable APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Align and verify APK structure
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=app/build/outputs/apk/release/NHTool-Stable-v2.0.7-aligned-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$ALIGNED" | head -30
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          tar -czf signing-tools.tar.gz signing-tools

      - name: Upload aligned APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: NHTool-Stable-v2.0.7-aligned-build
          path: |
            app/build/outputs/apk/release/NHTool-Stable-v2.0.7-aligned-unsigned.apk
            signing-tools.tar.gz
          if-no-files-found: error
